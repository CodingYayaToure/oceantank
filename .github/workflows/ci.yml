name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    env:
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: OpenGL / EGL libraries (Mesa software rendering)
        run: sudo apt-get update && sudo apt-get install -y libegl1 libegl-mesa0 libgl1 libgles2 libgl1-mesa-dri
      - name: Install
        run: pip install -e ".[test]"
      - name: Test
        run: pytest
