[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "oceantank"
version = "0.1.2"
description = "Rectangular glass tank filled with ocean water: headless OpenGL rendering that reproduces an HTML/three.js animation"
readme = "README.md"
license = {text = "MIT"}
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Visualization",
]
requires-python = ">=3.10"
dependencies = ["numpy", "moderngl", "pillow"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
oceantank = "oceantank.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
oceantank = ["shaders/*.vert", "shaders/*.frag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
